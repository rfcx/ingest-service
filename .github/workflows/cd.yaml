name: 'CD'
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - staging
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:

  prepare:
    name: 'Prepare'
    uses: rfcx/cicd/.github/workflows/notify-prepare.yaml@master
    with:
      repo: ingest-service
      workflow-id: cd.yaml
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  configure:
    name: 'Configure'
    runs-on: ubuntu-latest
    needs: [prepare]
    outputs:
      namespace: ${{ steps.configuration.outputs.namespace }}
    steps:
      - name: 'Conditional environment'
        id: configuration
        run: |
          if [[ "${{ needs.prepare.outputs.branch-name }}" == "master" ]]; then
            echo "::set-output name=namespace::production"
          elif [[ "${{ needs.prepare.outputs.branch-name }}" == "staging" ]]; then
            echo "::set-output name=namespace::staging"
          else
            echo "::set-output name=namespace::testing"
          fi

  deploy-rfcx-local:
    name: 'Deploy: rfcx-local'
    needs: [prepare, configure]
    if: ${{ needs.configure.outputs.namespace == 'production' }}
    uses: rfcx/cicd/.github/workflows/rfcx-local-cd.yaml@master
    with:
      repo: ingest-service
      dockerfile: build/Dockerfile
      targets: '["ingest-service"]'
      # BuildKit registry layer cache (rfcx/cicd#10, 2026-09-04). Single
      # target, so the win is cross-RUN: the `base` stage (two apt installs,
      # nvm + node install via curl, npm -g yarn) has NO source dependency and
      # the `yarn --frozen-lockfile` layer depends only on the lockfile -- all
      # of it stays cached until those inputs change. Last master run: 99s
      # build. Fails safe (missing/GC'd cache tag = miss, ignore-error on
      # export). Pattern proven on rfcx/arbimon (14.6 -> 2.5 min).
      build-cache: true
      deployments: |
        [
          {"name": "ingest-service-api",   "image": "ingest-service"},
          {"name": "ingest-service-tasks", "image": "ingest-service"}
        ]


  notify:
    name: 'Notify'
    if: ${{ always() }}
    needs: [prepare, deploy-rfcx-local]
    uses: rfcx/cicd/.github/workflows/notify-send.yaml@master
    with:
      repo: ingest-service
      branch-name: ${{ needs.prepare.outputs.branch-name }}
      workflow-id: cd.yaml
      previous-run-id: ${{ needs.prepare.outputs.previous-run-id }}
      status: ${{ needs.deploy-rfcx-local.result }}
      always: true
      notification-title: 'CD: Ingest Service'
      notification-footer: "Deploy (rfcx-local): ${{ needs.deploy-rfcx-local.result || 'n/a' }}"
      notification-success-statement: '{0} deployed the build!'
    secrets:
      slack-webhook: ${{ secrets.SLACK_ALERT_COREDT_WEBHOOK }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
